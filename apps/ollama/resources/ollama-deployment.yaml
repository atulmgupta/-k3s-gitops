apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      # Pin to helium — only GPU node in the cluster (RTX 3050 OEM 8GB).
      nodeSelector:
        kubernetes.io/hostname: helium
      # Required on k3s — nvidia is a named (non-default) containerd runtime.
      # The runtime hook mounts libnvidia-ml.so and the GPU devices into the pod.
      runtimeClassName: nvidia
      containers:
        - name: ollama
          image: ollama/ollama:0.23.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # Cap loaded models to 1 — 8GB VRAM can't hold multiple 7B+ models.
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            # Keep model warm in VRAM between requests for snappy responses.
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"
            # Restrict CORS to the only origins that should call us via browser.
            # Open WebUI calls server-to-server so doesn't need to be listed.
            - name: OLLAMA_ORIGINS
              value: "https://chat.cyphers.app,https://ollama.cyphers.app"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "8"
              memory: 10Gi
              nvidia.com/gpu: 1
          # Generous startupProbe so first model load / GPU init doesn't trip
          # liveness. After 5 min of startup grace, normal probes take over.
          startupProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
