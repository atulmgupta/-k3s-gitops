---
# =============================================================================
# TeslaSync — Distributed Tracing (RED + Service Map)
# =============================================================================
# Powered by Tempo's span-metrics & service-graph processors. Requires
# `tempo.metricsGenerator.enabled: true` in apps/tempo/helm.yaml plus
# `overrides.defaults.metrics_generator.processors: [service-graphs,
# span-metrics]`. Span metrics arrive in Prometheus as
# `traces_spanmetrics_*`; service graph as `traces_service_graph_*`.
# Trace search panel uses the Tempo datasource directly via TraceQL.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: teslasync-tracing
  namespace: grafana
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: TeslaSync Infra
data:
  teslasync-tracing.json: |
    {
      "uid": "teslasync-tracing",
      "title": "TeslaSync - Distributed Tracing (RED)",
      "tags": ["teslasync", "tracing", "tempo", "infra"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(traces_spanmetrics_calls_total{service=~\"teslasync.*\"}, service)",
            "regex": "",
            "includeAll": true,
            "multi": true,
            "refresh": 2,
            "current": { "selected": true, "text": "All", "value": "$__all" }
          },
          {
            "name": "span_kind",
            "label": "Span Kind",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(traces_spanmetrics_calls_total{service=~\"$service\"}, span_kind)",
            "includeAll": true,
            "multi": true,
            "refresh": 2,
            "current": { "selected": true, "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1, "type": "row", "title": "RED Overview",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 },
          "collapsed": false, "panels": []
        },
        {
          "id": 2, "type": "stat", "title": "Total Request Rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(rate(traces_spanmetrics_calls_total{service=~\"$service\", span_kind=~\"$span_kind\"}[5m]))", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "graphMode": "area" },
          "gridPos": { "x": 0, "y": 1, "w": 4, "h": 5 }
        },
        {
          "id": 3, "type": "stat", "title": "Error Rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(rate(traces_spanmetrics_calls_total{service=~\"$service\", span_kind=~\"$span_kind\", status_code=\"STATUS_CODE_ERROR\"}[5m]))", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.1 }, { "color": "red", "value": 1 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "graphMode": "area" },
          "gridPos": { "x": 4, "y": 1, "w": 4, "h": 5 }
        },
        {
          "id": 4, "type": "stat", "title": "Error %",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "(sum(rate(traces_spanmetrics_calls_total{service=~\"$service\", span_kind=~\"$span_kind\", status_code=\"STATUS_CODE_ERROR\"}[5m])) or vector(0)) / clamp_min(sum(rate(traces_spanmetrics_calls_total{service=~\"$service\", span_kind=~\"$span_kind\"}[5m])), 0.001)", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.01 }, { "color": "red", "value": 0.05 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "graphMode": "area" },
          "gridPos": { "x": 8, "y": 1, "w": 4, "h": 5 }
        },
        {
          "id": 5, "type": "stat", "title": "Latency p50",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "histogram_quantile(0.50, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=~\"$service\", span_kind=~\"$span_kind\"}[5m])))", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "s" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "gridPos": { "x": 12, "y": 1, "w": 4, "h": 5 }
        },
        {
          "id": 6, "type": "stat", "title": "Latency p95",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=~\"$service\", span_kind=~\"$span_kind\"}[5m])))", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "gridPos": { "x": 16, "y": 1, "w": 4, "h": 5 }
        },
        {
          "id": 7, "type": "stat", "title": "Latency p99",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "histogram_quantile(0.99, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=~\"$service\", span_kind=~\"$span_kind\"}[5m])))", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 2 }, { "color": "red", "value": 10 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "gridPos": { "x": 20, "y": 1, "w": 4, "h": 5 }
        },
        {
          "id": 10, "type": "row", "title": "Traffic & Errors per Service",
          "gridPos": { "x": 0, "y": 6, "w": 24, "h": 1 }, "collapsed": false, "panels": []
        },
        {
          "id": 11, "type": "timeseries", "title": "Request Rate (by service)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum by (service) (rate(traces_spanmetrics_calls_total{service=~\"$service\", span_kind=~\"$span_kind\"}[2m]))", "legendFormat": "{{service}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "gridPos": { "x": 0, "y": 7, "w": 12, "h": 8 }
        },
        {
          "id": 12, "type": "timeseries", "title": "Error Rate (by service)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum by (service) (rate(traces_spanmetrics_calls_total{service=~\"$service\", span_kind=~\"$span_kind\", status_code=\"STATUS_CODE_ERROR\"}[2m]))", "legendFormat": "{{service}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "palette-classic" } } },
          "gridPos": { "x": 12, "y": 7, "w": 12, "h": 8 }
        },
        {
          "id": 13, "type": "timeseries", "title": "Latency p95 (by service)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (service, le) (rate(traces_spanmetrics_latency_bucket{service=~\"$service\", span_kind=~\"$span_kind\"}[5m])))", "legendFormat": "{{service}} p95", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "x": 0, "y": 15, "w": 12, "h": 8 }
        },
        {
          "id": 14, "type": "timeseries", "title": "Latency p99 (by service)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "histogram_quantile(0.99, sum by (service, le) (rate(traces_spanmetrics_latency_bucket{service=~\"$service\", span_kind=~\"$span_kind\"}[5m])))", "legendFormat": "{{service}} p99", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "x": 12, "y": 15, "w": 12, "h": 8 }
        },
        {
          "id": 20, "type": "row", "title": "Top Operations",
          "gridPos": { "x": 0, "y": 23, "w": 24, "h": 1 }, "collapsed": false, "panels": []
        },
        {
          "id": 21, "type": "table", "title": "Top 20 Operations by Request Rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "topk(20, sum by (service, span_name) (rate(traces_spanmetrics_calls_total{service=~\"$service\", span_kind=~\"$span_kind\"}[5m])))", "format": "table", "instant": true, "refId": "A" }],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true }, "renameByName": { "Value": "req/s" } } }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [{ "matcher": { "id": "byName", "options": "req/s" }, "properties": [{ "id": "unit", "value": "reqps" }, { "id": "custom.cellOptions", "value": { "type": "color-background-solid" } }] }] },
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 10 }
        },
        {
          "id": 22, "type": "table", "title": "Top 20 Operations by p95 Latency",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "topk(20, histogram_quantile(0.95, sum by (service, span_name, le) (rate(traces_spanmetrics_latency_bucket{service=~\"$service\", span_kind=~\"$span_kind\"}[5m]))))", "format": "table", "instant": true, "refId": "A" }],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true }, "renameByName": { "Value": "p95 latency" } } }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [{ "matcher": { "id": "byName", "options": "p95 latency" }, "properties": [{ "id": "unit", "value": "s" }] }] },
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 10 }
        },
        {
          "id": 23, "type": "table", "title": "Top 20 Operations by Error Rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "topk(20, sum by (service, span_name) (rate(traces_spanmetrics_calls_total{service=~\"$service\", span_kind=~\"$span_kind\", status_code=\"STATUS_CODE_ERROR\"}[5m])))", "format": "table", "instant": true, "refId": "A" }],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true }, "renameByName": { "Value": "err/s" } } }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [{ "matcher": { "id": "byName", "options": "err/s" }, "properties": [{ "id": "unit", "value": "reqps" }] }] },
          "gridPos": { "x": 0, "y": 34, "w": 24, "h": 10 }
        },
        {
          "id": 30, "type": "row", "title": "Service Graph",
          "gridPos": { "x": 0, "y": 44, "w": 24, "h": 1 }, "collapsed": false, "panels": []
        },
        {
          "id": 31, "type": "table", "title": "Service Edges (client → server, by request rate)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "topk(50, sum by (client, server) (rate(traces_service_graph_request_total{client=~\"$service|.*teslasync.*\"}[5m])))", "format": "table", "instant": true, "refId": "A" }],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true }, "renameByName": { "Value": "req/s" } } }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [{ "matcher": { "id": "byName", "options": "req/s" }, "properties": [{ "id": "unit", "value": "reqps" }] }] },
          "gridPos": { "x": 0, "y": 45, "w": 12, "h": 10 }
        },
        {
          "id": 32, "type": "table", "title": "Service Edges - Failed Requests",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "topk(50, sum by (client, server) (rate(traces_service_graph_request_failed_total{client=~\"$service|.*teslasync.*\"}[5m])))", "format": "table", "instant": true, "refId": "A" }],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true }, "renameByName": { "Value": "fail/s" } } }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [{ "matcher": { "id": "byName", "options": "fail/s" }, "properties": [{ "id": "unit", "value": "reqps" }] }] },
          "gridPos": { "x": 12, "y": 45, "w": 12, "h": 10 }
        },
        {
          "id": 40, "type": "row", "title": "Recent Traces",
          "gridPos": { "x": 0, "y": 55, "w": 24, "h": 1 }, "collapsed": false, "panels": []
        },
        {
          "id": 41, "type": "traces", "title": "Slow Traces (> 1s)",
          "datasource": { "type": "tempo", "uid": "tempo" },
          "targets": [{ "queryType": "traceql", "refId": "A", "limit": 30, "tableType": "traces", "query": "{ resource.service.name =~ \"teslasync.*\" && duration > 1s }" }],
          "gridPos": { "x": 0, "y": 56, "w": 24, "h": 10 }
        },
        {
          "id": 42, "type": "traces", "title": "Error Traces",
          "datasource": { "type": "tempo", "uid": "tempo" },
          "targets": [{ "queryType": "traceql", "refId": "A", "limit": 30, "tableType": "traces", "query": "{ resource.service.name =~ \"teslasync.*\" && status = error }" }],
          "gridPos": { "x": 0, "y": 66, "w": 24, "h": 10 }
        }
      ]
    }
