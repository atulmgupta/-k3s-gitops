# =============================================================================
# TeslaSync — Helm Application (ArgoCD)
# =============================================================================
# Real-time Tesla vehicle data platform using the TimescaleDB-backed chart.
# Secrets are managed via SOPS in resources.yaml using existingSecret.
# =============================================================================
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teslasync
  namespace: argocd
  labels:
    tier: apps
spec:
  project: default
  source:
    repoURL: ghcr.io/ev-dev-labs/charts
    chart: teslasync
    targetRevision: "0.33.0-rc.refactor-alert-engine.ge8bfff72"
    helm:
      releaseName: teslasync
      valuesObject:
        replicaCount: 1
        image:
          repository: ghcr.io/ev-dev-labs/teslasync-api
          tag: "0.33.0-rc.refactor-alert-engine.ge8bfff72"

        secrets:
          existingSecret: teslasync

        encryption:
          key: ""

        auth:
          jwtSecret: ""

        # Phase-42 / ADR-004 #5 + #9 — operator surface (chart >= 0.33).
        # Powers cmd/resubscribe + cmd/unit-drift-validator. Both refuse to
        # run with an empty token, so leaving this empty keeps them disabled.
        # When ready to enable, generate `openssl rand -hex 32` and add
        # TESLASYNC_OPERATOR_TOKEN to the SOPS-managed `teslasync` Secret —
        # the existingSecret pattern means we do NOT set the value here.
        operator:
          token: ""

        # Phase-42 / ADR-004 #9 — nightly unit-drift validator CronJob.
        # Read-only sweep of vehicle_unit_history; emits Prometheus counters.
        # Disabled until `operator.token` is seeded in the SOPS Secret.
        unitDriftValidator:
          enabled: false

        # Web Push (VAPID) — Phase 40 / Prompt 52
        # Chart 0.32.11 wires VAPID natively:
        #   webPush.publicKey  → ConfigMap (TESLASYNC_VAPID_PUBLIC_KEY) — non-secret, set inline
        #   webPush.privateKey → chart Secret (skipped via existingSecret)  → SOPS
        #   webPush.subject    → chart Secret (skipped via existingSecret)  → SOPS
        # ⚠️  Rotating these keys invalidates every existing browser subscription.
        webPush:
          publicKey: "BNMoSuDoR-awiKVyNXQcTGXm01z9U0T675yLyLYJ44P5FK0jXm_uFayR83-68x3n5Ub2JXd6Ta8hNFD6oPRHSrg"

        config:
          apiEndpoint: http://teslasync-api.teslasync.svc.cluster.local:8080
          webEndpoint: https://teslasync.cyphers.app
          browserApiBase: ""
          logLevel: info
          pollInterval: 30s
          sleepPollMultiplier: 4
          forwardAuthHeader: ""
          # Phase 46 / Prompt 57 — free-text IdP hint shown in SPA's RequiresAuth empty state.
          authProviderHint: "Authentik"
          # Phase 46 / Prompt 70 — single-user self-host: no GDPR banner needed.
          requireCookieConsent: false
          googleMaps:
            apiKey: ""
          azureMaps:
            apiKey: ""
          # Traces ship to the cluster-wide Tempo at apps/tempo/ (single-binary,
          # 7d retention, 50Gi Longhorn PVC). Grafana datasource is pre-wired
          # in apps/grafana/resources/datasource-tempo.yaml — view spans via
          # Grafana Explore → Tempo, or TraceQL queries like
          #   { resource.service.name = "teslasync" && duration > 500ms }
          openTelemetry:
            enabled: true
            endpoint: tempo.tempo.svc.cluster.local:4317
            insecure: true
            serviceName: teslasync
          # Inbound API call logs — Phase 38-10
          # Persists every inbound /api/v1 request to api_call_logs.
          # Chart defaults (shown below) are sensible — uncomment only to override.
          # apiLogs:
          #   inboundEnabled: true     # API_LOGS_INBOUND_ENABLED
          #   captureBodies: false     # API_LOG_CAPTURE_BODIES (10 KB cap)
          #   queueCapacity: 4096      # API_LOG_QUEUE_CAPACITY
          #   batchSize: 100           # API_LOG_BATCH_SIZE
          #   flushInterval: "1s"      # API_LOG_FLUSH_INTERVAL

        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }

        # Mirrors upstream chart 0.6.1+ default (commit d5745abd5).
        # Pins api + workers (notification, export, automation) and
        # command-proxy to carbon — they share state with TimescaleDB,
        # MQTT, and Redis on that node, so colocation removes a hop and
        # avoids the apiserver→carbon konnectivity tunnel that
        # occasionally wedges after a NodeNotReady flap. Web + fleet-
        # telemetry have their own per-component knobs below.
        nodeSelector:
          kubernetes.io/hostname: carbon

        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            namespace: prometheus
            interval: "30s"
            namespaceSelector:
              matchNames:
                - teslasync

        service:
          port: 8080
          type: ClusterIP

        tesla:
          apiBaseUrl: https://fleet-api.prd.na.vn.cloud.tesla.com
          authUrl: "https://auth.tesla.com"
          timeout: "30s"
          redirectUri: https://teslasync.cyphers.app/api/v1/auth/callback

        retention:
          {}
          # Audit log retention — Phase 40 / Prompt 49
          # Defaults to API server values (365 days / 30 days) when unset.
          # To override, REMOVE the `{}` line above and uncomment:
          # auditDays: 365      # AUDIT_RETENTION_DAYS — hard-delete after this
          # auditIpDays: 30     # AUDIT_IP_RETENTION_DAYS — null IP/UA after this

        gasPrice:
          enabled: true
          pollInterval: 15d

        # Phase 46 / Prompt 04 — operator override for the maintenance banner.
        # Empty `mode` defers to the system_state DB row + admin POST API.
        # Set mode to "ok" / "degraded" / "maintenance" to force the banner
        # without touching the DB (useful during deploys/rollbacks).
        system:
          mode: ""
          maintenanceMessage: ""
          maintenanceUntil: ""

        # Phase 46 / Prompt 08 — GitHub Issues bridge for in-app feedback.
        # To enable: set repo to "owner/name" and add TESLASYNC_GITHUB_TOKEN
        # (fine-grained PAT with Issues:write on `repo`) to the SOPS Secret.
        github:
          repo: ""

        # Phase 46 / Prompt 54 — vehicle hero photos.
        # ⚠️  Chart 0.32.11 has no `extraVolumes`/`extraVolumeMounts` hook on
        # the API deployment, AND securityContext.readOnlyRootFilesystem=true
        # is enabled by default. Until the chart adds a volume hook (or a
        # built-in PVC for photos), uploads will fail with EROFS. Track this
        # upstream before relying on the feature.
        vehiclePhotos:
          dir: "/var/lib/teslasync/photos"

        web:
          enabled: true
          replicaCount: 1
          image:
            repository: ghcr.io/ev-dev-labs/teslasync-web
            tag: "0.33.0-rc.refactor-alert-engine.ge8bfff72"
            pullPolicy: IfNotPresent
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          service:
            port: 80
            type: LoadBalancer
            loadBalancerIP: "192.168.68.220"
          # Colocate web with the rest of the teslasync stack on carbon.
          nodeSelector:
            kubernetes.io/hostname: carbon

        commandProxy:
          enabled: true
          image:
            repository: tesla/vehicle-command
            tag: latest
            pullPolicy: IfNotPresent
          secretName: tesla-command-proxy
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          service:
            port: 4443
            type: ClusterIP

        fleetTelemetry:
          enabled: true
          host: telemetry.cyphers.app
          image: tesla/fleet-telemetry:latest
          # DEPRECATED — no-op on the per-field MQTT path (per upstream
          # commit a3fdb1dfb). Per-field subscriber processes each
          # {VIN, field} individually; kept for legacy values-file
          # compat but no production code reads it.
          batchMs: 100
          fallbackPollInterval: "5m"
          staleTimeout: "15m"
          snapshotWriteInterval: "1s"
          cleanupInterval: "2m"
          staleSessionTimeout: "5m"
          liveSignalStoreMode: hybrid
          topicBase: telemetry
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # NodePort 30443 is forwarded by the home router from WAN 8443
          # → carbon:30443 (carbon's real MAC keeps Deco's port-forward
          # MAC binding happy; a MetalLB virtual IP wouldn't have a MAC).
          service:
            type: NodePort
            port: 4443
            nodePort: 30443
            externalIPs: []
          # Pin fleet-telemetry to carbon (chart >= g18cda627 honors this
          # plus tolerations/affinity hooks on the Deployment).
          nodeSelector:
            kubernetes.io/hostname: carbon
          tolerations: []
          affinity: {}
          tls:
            secretName: production-cyphers-app-tls
          metrics:
            serviceMonitor:
              enabled: true
              interval: "30s"
          ingressRouteTCP:
            enabled: true
            annotations:
              kubernetes.io/ingress.class: traefik-external
            entryPoints:
              - websecure
            host: telemetry.cyphers.app

        exportWorker:
          enabled: true
          replicaCount: 1
          dbMaxConns: 5
          dbMinConns: 2
          image:
            repository: ghcr.io/ev-dev-labs/teslasync-export-worker
            tag: "0.33.0-rc.refactor-alert-engine.ge8bfff72"
            pullPolicy: IfNotPresent
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 512Mi }
          service:
            port: 8082
            type: ClusterIP

        notificationWorker:
          enabled: true
          replicaCount: 1
          dbMaxConns: 5
          dbMinConns: 2
          image:
            repository: ghcr.io/ev-dev-labs/teslasync-notification-worker
            tag: "0.33.0-rc.refactor-alert-engine.ge8bfff72"
            pullPolicy: IfNotPresent
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          service:
            port: 8081
            type: ClusterIP

        automationWorker:
          enabled: true
          replicaCount: 1
          dbMaxConns: 5
          dbMinConns: 2
          image:
            repository: ghcr.io/ev-dev-labs/teslasync-automation-worker
            tag: "0.33.0-rc.refactor-alert-engine.ge8bfff72"
            pullPolicy: IfNotPresent
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          service:
            port: 8083
            type: ClusterIP

        postgresql:
          enabled: false
          maxConns: 25
          minConns: 5
          connectTimeout: 5
          statementTimeout: 30000
          healthCheckPeriod: "5s"
          external:
            host: timescaledb.timescaledb.svc.cluster.local
            port: 5432
            database: teslasync
            username: teslasync
            sslMode: disable

        redis:
          enabled: false
          db: 1
          external:
            host: redis-master.redis.svc.cluster.local
            port: 6379

        mongodb:
          enabled: false
          database: teslasync_dev
          ttlDays: 7
          external:
            uri: "external" #if using an external MongoDB instance

        mqtt:
          enabled: false
          clientId: "teslasync"
          prefix: "teslasync"
          external:
            host: mqtt-emqx.mqtt.svc.cluster.local
            port: 1883
          # Phase-42 / ADR-004 #8 — TESLA_MQTT_MAX_REDELIVERIES.
          # Read by cmd/teslasync via PipelineSubscriberConfig.
          maxRedeliveries: 5

        grafana:
          enabled: false

        jaeger:
          enabled: false

        # ─── Observability stack (chart phase-44, requires chart >= 0.33) ──────
        # The chart ships an in-cluster OTel collector + Tempo single-binary
        # for self-contained installs. We run a cluster-wide Tempo at
        # apps/tempo/ instead, so both are kept disabled here. When chart
        # >= 0.33 lands and exposes an external-Tempo endpoint, point the
        # otelCollector exporter at tempo.tempo.svc.cluster.local:4317.
        observability:
          otelCollector:
            enabled: false
          tempo:
            enabled: false

        ingress:
          enabled: false

        ingressRoute:
          enabled: true
          annotations:
            kubernetes.io/ingress.class: traefik-external
          entryPoints:
            - websecure
          namespace: teslasync
          # SSE bypass route — auto-added before catch-all when ForwardAuth is used.
          # Bypasses Authentik for /api/v1/events so the Go backend validates JWT
          # directly (Authentik middleware can break long-lived SSE connections).
          # Uncomment if SSE clients get disconnected/401'd by Authentik.
          # sseBypass:
          #   match: "Host(`teslasync.cyphers.app`) && PathPrefix(`/api/v1/events`)"
          #   middlewares:
          #     - name: default-headers
          #       namespace: traefik
          #   services:
          #     - name: teslasync-web
          #       port: 80
          routes:
            - kind: Rule
              match: "Host(`teslasync.cyphers.app`) && PathPrefix(`/.well-known`)"
              middlewares:
                - name: default-headers
                  namespace: traefik
              services:
                - name: teslasync-web
                  port: 80
            # PWA shell bypass — Authentik must NOT gate the service worker,
            # PWA manifest, or workbox runtime. When these requests hit
            # ForwardAuth without a valid session, Authentik returns a 302 to
            # its login page; the browser sees a non-JS / opaque-redirect
            # response, fails the SW script update, eventually unregisters
            # the registration, and DROPS the PushSubscription tied to it.
            # Symptom: users have to click "Enable on this device" again
            # after every deploy or session expiry. These files contain no
            # per-user data and are safe to expose unauthenticated.
            - kind: Rule
              match: "Host(`teslasync.cyphers.app`) && (Path(`/sw.js`) || Path(`/sw.js.map`) || Path(`/manifest.webmanifest`) || Path(`/registerSW.js`) || PathRegexp(`^/workbox-[a-f0-9]+\\.js(\\.map)?$`))"
              middlewares:
                - name: default-headers
                  namespace: traefik
              services:
                - name: teslasync-web
                  port: 80
            - kind: Rule
              match: "Host(`teslasync.cyphers.app`)"
              middlewares:
                - name: authentik-auth
                  namespace: authentik
                - name: default-headers
                  namespace: traefik
              services:
                - name: teslasync-web
                  port: 80
          tls:
            enabled: true
            secretName: production-cyphers-app-tls

  destination:
    server: https://kubernetes.default.svc
    namespace: teslasync
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: tesla-command-proxy
      jsonPointers:
        - /data
        - /stringData

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
