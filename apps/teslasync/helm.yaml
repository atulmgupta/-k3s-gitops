# =============================================================================
# TeslaSync — Helm Application (ArgoCD)
# =============================================================================
# Real-time Tesla vehicle data platform using the TimescaleDB-backed chart.
# Secrets are managed via SOPS in resources.yaml using existingSecret.
# =============================================================================
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teslasync
  namespace: argocd
  labels:
    tier: apps
spec:
  project: default
  source:
    repoURL: ghcr.io/ev-dev-labs/charts
    chart: teslasync
    targetRevision: "0.32.11"
    helm:
      releaseName: teslasync
      valuesObject:
        replicaCount: 1
        image:
          repository: ghcr.io/ev-dev-labs/teslasync-api
          tag: "0.32.11"

        secrets:
          existingSecret: teslasync

        encryption:
          key: ""

        auth:
          jwtSecret: ""

        # Web Push (VAPID) — Phase 40 / Prompt 52
        # Chart 0.32.11 wires VAPID natively:
        #   webPush.publicKey  → ConfigMap (TESLASYNC_VAPID_PUBLIC_KEY) — non-secret, set inline
        #   webPush.privateKey → chart Secret (skipped via existingSecret)  → SOPS
        #   webPush.subject    → chart Secret (skipped via existingSecret)  → SOPS
        # ⚠️  Rotating these keys invalidates every existing browser subscription.
        webPush:
          publicKey: "BNMoSuDoR-awiKVyNXQcTGXm01z9U0T675yLyLYJ44P5FK0jXm_uFayR83-68x3n5Ub2JXd6Ta8hNFD6oPRHSrg"

        config:
          apiEndpoint: http://teslasync-api.teslasync.svc.cluster.local:8080
          webEndpoint: https://teslasync.cyphers.app
          browserApiBase: ""
          logLevel: info
          pollInterval: 30s
          sleepPollMultiplier: 4
          forwardAuthHeader: ""
          # Phase 46 / Prompt 57 — free-text IdP hint shown in SPA's RequiresAuth empty state.
          authProviderHint: "Authentik"
          # Phase 46 / Prompt 70 — single-user self-host: no GDPR banner needed.
          requireCookieConsent: false
          googleMaps:
            apiKey: ""
          azureMaps:
            apiKey: ""
          openTelemetry:
            enabled: false
            endpoint: jaeger:4317
            insecure: true
            serviceName: teslasync
          # Inbound API call logs — Phase 38-10
          # Persists every inbound /api/v1 request to api_call_logs.
          # Chart defaults (shown below) are sensible — uncomment only to override.
          # apiLogs:
          #   inboundEnabled: true     # API_LOGS_INBOUND_ENABLED
          #   captureBodies: false     # API_LOG_CAPTURE_BODIES (10 KB cap)
          #   queueCapacity: 4096      # API_LOG_QUEUE_CAPACITY
          #   batchSize: 100           # API_LOG_BATCH_SIZE
          #   flushInterval: "1s"      # API_LOG_FLUSH_INTERVAL

        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }

        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            namespace: prometheus
            interval: "30s"
            namespaceSelector:
              matchNames:
                - teslasync

        service:
          port: 8080
          type: ClusterIP

        tesla:
          apiBaseUrl: https://fleet-api.prd.na.vn.cloud.tesla.com
          authUrl: "https://auth.tesla.com"
          timeout: "30s"
          redirectUri: https://teslasync.cyphers.app/api/v1/auth/callback

        retention:
          {}
          # Audit log retention — Phase 40 / Prompt 49
          # Defaults to API server values (365 days / 30 days) when unset.
          # To override, REMOVE the `{}` line above and uncomment:
          # auditDays: 365      # AUDIT_RETENTION_DAYS — hard-delete after this
          # auditIpDays: 30     # AUDIT_IP_RETENTION_DAYS — null IP/UA after this

        gasPrice:
          enabled: true
          pollInterval: 15d

        # Phase 46 / Prompt 04 — operator override for the maintenance banner.
        # Empty `mode` defers to the system_state DB row + admin POST API.
        # Set mode to "ok" / "degraded" / "maintenance" to force the banner
        # without touching the DB (useful during deploys/rollbacks).
        system:
          mode: ""
          maintenanceMessage: ""
          maintenanceUntil: ""

        # Phase 46 / Prompt 08 — GitHub Issues bridge for in-app feedback.
        # To enable: set repo to "owner/name" and add TESLASYNC_GITHUB_TOKEN
        # (fine-grained PAT with Issues:write on `repo`) to the SOPS Secret.
        github:
          repo: ""

        # Phase 46 / Prompt 54 — vehicle hero photos.
        # ⚠️  Chart 0.32.11 has no `extraVolumes`/`extraVolumeMounts` hook on
        # the API deployment, AND securityContext.readOnlyRootFilesystem=true
        # is enabled by default. Until the chart adds a volume hook (or a
        # built-in PVC for photos), uploads will fail with EROFS. Track this
        # upstream before relying on the feature.
        vehiclePhotos:
          dir: "/var/lib/teslasync/photos"

        web:
          enabled: true
          replicaCount: 1
          image:
            repository: ghcr.io/ev-dev-labs/teslasync-web
            tag: "0.32.11"
            pullPolicy: IfNotPresent
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          service:
            port: 80
            type: LoadBalancer
            loadBalancerIP: "192.168.68.220"

        commandProxy:
          enabled: true
          image:
            repository: tesla/vehicle-command
            tag: latest
            pullPolicy: IfNotPresent
          secretName: tesla-command-proxy
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          service:
            port: 4443
            type: ClusterIP

        fleetTelemetry:
          enabled: true
          host: telemetry.cyphers.app
          image: tesla/fleet-telemetry:latest
          batchMs: 100
          fallbackPollInterval: "5m"
          staleTimeout: "15m"
          snapshotWriteInterval: "1s"
          cleanupInterval: "2m"
          staleSessionTimeout: "5m"
          liveSignalStoreMode: hybrid
          topicBase: telemetry
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          service:
            port: 4443
            type: ClusterIP
          tls:
            secretName: production-cyphers-app-tls
          metrics:
            serviceMonitor:
              enabled: true
              interval: "30s"
          ingressRouteTCP:
            enabled: true
            annotations:
              kubernetes.io/ingress.class: traefik-external
            entryPoints:
              - websecure
            host: telemetry.cyphers.app

        exportWorker:
          enabled: true
          replicaCount: 1
          dbMaxConns: 5
          dbMinConns: 2
          image:
            repository: ghcr.io/ev-dev-labs/teslasync-export-worker
            tag: "0.32.11"
            pullPolicy: IfNotPresent
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 512Mi }
          service:
            port: 8082
            type: ClusterIP

        notificationWorker:
          enabled: true
          replicaCount: 1
          dbMaxConns: 5
          dbMinConns: 2
          image:
            repository: ghcr.io/ev-dev-labs/teslasync-notification-worker
            tag: "0.32.11"
            pullPolicy: IfNotPresent
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          service:
            port: 8081
            type: ClusterIP

        automationWorker:
          enabled: true
          replicaCount: 1
          dbMaxConns: 5
          dbMinConns: 2
          image:
            repository: ghcr.io/ev-dev-labs/teslasync-automation-worker
            tag: "0.32.11"
            pullPolicy: IfNotPresent
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          service:
            port: 8083
            type: ClusterIP

        postgresql:
          enabled: false
          maxConns: 25
          minConns: 5
          connectTimeout: 5
          statementTimeout: 30000
          healthCheckPeriod: "5s"
          external:
            host: timescaledb.timescaledb.svc.cluster.local
            port: 5432
            database: teslasync
            username: teslasync
            sslMode: disable

        redis:
          enabled: false
          db: 1
          external:
            host: redis-master.redis.svc.cluster.local
            port: 6379

        mongodb:
          enabled: false
          database: teslasync_dev
          ttlDays: 7
          external:
            uri: "external" #if using an external MongoDB instance

        mqtt:
          enabled: false
          clientId: "teslasync"
          prefix: "teslasync"
          external:
            host: mqtt-emqx.mqtt.svc.cluster.local
            port: 1883

        grafana:
          enabled: false

        jaeger:
          enabled: false

        ingress:
          enabled: false

        ingressRoute:
          enabled: true
          annotations:
            kubernetes.io/ingress.class: traefik-external
          entryPoints:
            - websecure
          namespace: teslasync
          # SSE bypass route — auto-added before catch-all when ForwardAuth is used.
          # Bypasses Authentik for /api/v1/events so the Go backend validates JWT
          # directly (Authentik middleware can break long-lived SSE connections).
          # Uncomment if SSE clients get disconnected/401'd by Authentik.
          # sseBypass:
          #   match: "Host(`teslasync.cyphers.app`) && PathPrefix(`/api/v1/events`)"
          #   middlewares:
          #     - name: default-headers
          #       namespace: traefik
          #   services:
          #     - name: teslasync-web
          #       port: 80
          routes:
            - kind: Rule
              match: "Host(`teslasync.cyphers.app`) && PathPrefix(`/.well-known`)"
              middlewares:
                - name: default-headers
                  namespace: traefik
              services:
                - name: teslasync-web
                  port: 80
            - kind: Rule
              match: "Host(`teslasync.cyphers.app`)"
              middlewares:
                - name: authentik-auth
                  namespace: authentik
                - name: default-headers
                  namespace: traefik
              services:
                - name: teslasync-web
                  port: 80
          tls:
            enabled: true
            secretName: production-cyphers-app-tls

  destination:
    server: https://kubernetes.default.svc
    namespace: teslasync
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: tesla-command-proxy
      jsonPointers:
        - /data
        - /stringData
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
