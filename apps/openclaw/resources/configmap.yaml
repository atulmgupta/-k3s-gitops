apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  labels:
    app: openclaw
data:
  # Gateway config. Bind 'custom' with customBindHost 0.0.0.0 so the in-cluster
  # Service can reach the pod (upstream defaults to "loopback" which only works
  # with `kubectl port-forward`; 'lan' requires a discoverable private LAN IP).
  # Token auth stays enabled — Control UI requires the OPENCLAW_GATEWAY_TOKEN.
  # Defense-in-depth: Traefik IngressRoute also sits behind authentik forward-auth.
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "custom",
        "customBindHost": "0.0.0.0",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true,
          "allowedOrigins": [
            "https://openclaw.cyphers.app"
          ]
        }
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace",
          "model": {
            "primary": "github-copilot/claude-opus-4.7"
          }
        },
        "list": [
          {
            "id": "default",
            "name": "OpenClaw Assistant",
            "workspace": "~/.openclaw/workspace"
          }
        ]
      },
      "cron": { "enabled": false },
      "skills": {
        "entries": {
          "1password": { "enabled": true },
          "apple-notes": { "enabled": true },
          "apple-reminders": { "enabled": true },
          "bear-notes": { "enabled": true },
          "blogwatcher": { "enabled": true },
          "blucli": { "enabled": true },
          "browser-automation": { "enabled": true },
          "camsnap": { "enabled": true },
          "canvas": { "enabled": true },
          "clawhub": { "enabled": true },
          "coding-agent": { "enabled": true },
          "diagram-maker": { "enabled": true },
          "discord": { "enabled": true },
          "eightctl": { "enabled": true },
          "gemini": { "enabled": true },
          "gh-issues": { "enabled": true },
          "gifgrep": { "enabled": true },
          "github": { "enabled": true },
          "gog": { "enabled": true },
          "goplaces": { "enabled": true },
          "healthcheck": { "enabled": true },
          "himalaya": { "enabled": true },
          "imsg": { "enabled": true },
          "mcporter": { "enabled": true },
          "meme-maker": { "enabled": true },
          "model-usage": { "enabled": true },
          "nano-pdf": { "enabled": true },
          "node-connect": { "enabled": true },
          "node-inspect-debugger": { "enabled": true },
          "notion": { "enabled": true },
          "obsidian": { "enabled": true },
          "openai-whisper": { "enabled": true },
          "openai-whisper-api": { "enabled": true },
          "openhue": { "enabled": true },
          "oracle": { "enabled": true },
          "ordercli": { "enabled": true },
          "peekaboo": { "enabled": true },
          "python-debugpy": { "enabled": true },
          "sag": { "enabled": true },
          "session-logs": { "enabled": true },
          "sherpa-onnx-tts": { "enabled": true },
          "skill-creator": { "enabled": true },
          "slack": { "enabled": true },
          "songsee": { "enabled": true },
          "sonoscli": { "enabled": true },
          "spike": { "enabled": true },
          "spotify-player": { "enabled": true },
          "summarize": { "enabled": true },
          "taskflow": { "enabled": true },
          "taskflow-inbox-triage": { "enabled": true },
          "things-mac": { "enabled": true },
          "tmux": { "enabled": true },
          "trello": { "enabled": true },
          "video-frames": { "enabled": true },
          "voice-call": { "enabled": true },
          "wacli": { "enabled": true },
          "weather": { "enabled": true },
          "xurl": { "enabled": true }
        }
      }
    }
  AGENTS.md: |
    # OpenClaw Assistant

    You are a helpful AI assistant running in a k3s homelab via GitOps.
    Provider: GitHub Copilot (configured via device-login).
