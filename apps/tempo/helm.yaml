# =============================================================================
# Tempo — Helm Application (ArgoCD)
# =============================================================================
# Cluster-wide Grafana Tempo (single-binary mode) for distributed-tracing
# storage. Apps push traces via OTLP; Grafana queries via the HTTP API and
# is auto-wired through the sidecar.datasources ConfigMap shipped in
# apps/grafana/resources/datasource-tempo.yaml.
#
# We use the community-maintained chart (the upstream grafana/helm-charts
# tempo chart was migrated to grafana-community on 2026-01-30).
# =============================================================================
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  labels:
    tier: monitoring
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    targetRevision: "2.*"
    helm:
      releaseName: tempo
      valuesObject:
        replicas: 1

        tempo:
          # Block retention enforced by the compactor. 7d matches the
          # teslasync chart default and our typical incident-investigation
          # window. Longhorn-backed PV is sized for ~7d at our trace volume.
          retention: 168h
          reportingEnabled: false
          # Span-metrics + service-graph generation. Tempo aggregates spans
          # in-process and remote-writes RED metrics + service-graph edges
          # to Prometheus. Powers the TeslaSync tracing dashboard and
          # Grafana's "Service Map" button on the Tempo datasource.
          metricsGenerator:
            enabled: true
            remoteWriteUrl: "http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090/api/v1/write"
            # Per-processor tuning. Mirrors the teslasync chart upstream so
            # RED dashboards (service-red, trace-explorer, db-tesla-breakdown,
            # mqtt-pipeline-traces, slo-burn) split traces_spanmetrics_*
            # series by HTTP method/route/status, DB system and messaging
            # system. Keep dimension cardinality reasonable — every value
            # combination becomes a distinct Prometheus series.
            processor:
              span_metrics:
                dimensions:
                  - http.method
                  - http.route
                  - http.status_code
                  - db.system
                  - messaging.system
                  - messaging.destination
                # Latency histogram bucket edges in seconds. Mirrors the
                # prom-default exponential ladder (0.002 → 15s) so SLO
                # burn-rate alerts and p99 panels render correctly.
                histogram_buckets:
                  - 0.002
                  - 0.004
                  - 0.008
                  - 0.016
                  - 0.032
                  - 0.064
                  - 0.128
                  - 0.256
                  - 0.512
                  - 1.024
                  - 2.048
                  - 4.096
                  - 8.192
                  - 15.0
              service_graphs: {}
          # Per-tenant overrides — required to actually turn on the
          # generator processors. Without this block metricsGenerator.enabled
          # only wires the component, no processors run.
          overrides:
            defaults:
              metrics_generator:
                processors:
                  - service-graphs
                  - span-metrics
          # Trim default receivers to OTLP only — we don't accept Jaeger /
          # OpenCensus / Zipkin protocols anywhere in the cluster, so
          # exposing them would just be unused listen sockets.
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: "0.0.0.0:4317"
                http:
                  endpoint: "0.0.0.0:4318"
          storage:
            trace:
              backend: local
              local:
                path: /var/tempo/traces
              wal:
                path: /var/tempo/wal
          server:
            http_listen_port: 3200
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi

        service:
          type: ClusterIP

        serviceMonitor:
          enabled: true
          interval: "30s"

        persistence:
          enabled: true
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          size: 50Gi

        # Drop the in-cluster query frontend — Grafana hits Tempo's HTTP
        # API directly via the datasource. tempo-query is only needed when
        # exposing the Jaeger UI, which we don't.
        tempoQuery:
          enabled: false

        # Tempo writes as uid:gid 10001 — must match PV ownership.
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          fsGroup: 10001
          runAsNonRoot: true

  destination:
    server: https://kubernetes.default.svc
    namespace: tempo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
