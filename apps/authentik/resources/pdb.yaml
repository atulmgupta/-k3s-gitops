---
# PodDisruptionBudget for the Authentik Traefik ForwardAuth outpost.
# Protects all 46 *.cyphers.app IngressRoutes from losing all auth backends
# during voluntary disruptions (node drains, evictions, rollouts).
#
# IMPORTANT — Outpost MUST run with kubernetes_replicas: 1 in the Authentik
# outpost config (Admin UI → Applications → Outposts → traefik → Edit).
# Reason: the proxy outpost stores OAuth flow state in /dev/shm (per-pod
# tmpfs). With multiple replicas the OAuth callback can land on a different
# pod than the one that started the flow → "mismatched session ID" → HTTP 400.
# A multi-replica setup would need Redis-backed sessions which the chart does
# not currently expose.
#
# This PDB keeps minAvailable: 1 so that node drains explicitly fail (rather
# than silently evicting the single outpost and breaking SSO). Use
# `kubectl drain --disable-eviction --force` when intentionally draining the
# node hosting the outpost.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ak-outpost-traefik
  namespace: authentik
  labels:
    app.kubernetes.io/managed-by: goauthentik.io
    goauthentik.io/outpost-name: traefik
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: goauthentik.io
      app.kubernetes.io/name: authentik-outpost-proxy
      goauthentik.io/outpost-name: traefik
