---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-ddns
  labels:
    app.kubernetes.io/name: cloudflare-ddns
data:
  cloudflare-ddns.py: |
    import ipaddress
    import json
    import os
    import sys
    from urllib.error import HTTPError, URLError
    from urllib.parse import quote
    from urllib.request import Request, urlopen

    API_BASE = "https://api.cloudflare.com/client/v4"
    IP_SERVICES = (
        "https://api.ipify.org",
        "https://icanhazip.com",
        "https://ifconfig.me/ip",
    )


    def fail(message):
        print(f"ERROR: {message}", file=sys.stderr)
        sys.exit(1)


    def request(method, path, token, body=None):
        data = None
        headers = {
            "Authorization": f"Bearer {token}",
            "Content-Type": "application/json",
        }
        if body is not None:
            data = json.dumps(body).encode("utf-8")

        req = Request(f"{API_BASE}{path}", data=data, headers=headers, method=method)
        try:
            with urlopen(req, timeout=30) as response:
                payload = json.loads(response.read().decode("utf-8"))
        except HTTPError as exc:
            detail = exc.read().decode("utf-8", errors="replace")
            fail(f"Cloudflare API {method} {path} failed: HTTP {exc.code}: {detail}")
        except URLError as exc:
            fail(f"Cloudflare API {method} {path} failed: {exc.reason}")

        if not payload.get("success"):
            fail(f"Cloudflare API {method} {path} returned errors: {payload.get('errors')}")
        return payload.get("result")


    def current_public_ip():
        errors = []
        for url in IP_SERVICES:
            try:
                with urlopen(url, timeout=15) as response:
                    value = response.read().decode("utf-8").strip()
                ip = ipaddress.ip_address(value)
                if ip.version == 4:
                    return str(ip)
                errors.append(f"{url}: returned non-IPv4 address {value}")
            except Exception as exc:
                errors.append(f"{url}: {exc}")
        fail("could not discover public IPv4 address; " + "; ".join(errors))


    def parse_bool(value):
        if isinstance(value, bool):
            return value
        return str(value).strip().lower() in ("1", "true", "yes", "on")


    def bool_env(name, default):
        value = os.getenv(name)
        if value is None:
            return default
        return parse_bool(value)


    def parse_record_specs():
        default_ttl = int(os.environ.get("CLOUDFLARE_TTL", "300"))
        default_proxied = bool_env("CLOUDFLARE_PROXIED", False)
        raw_records = os.environ.get("CLOUDFLARE_RECORDS", "").strip()
        if not raw_records:
            fail("CLOUDFLARE_RECORDS must contain at least one DNS record")

        if raw_records.startswith("["):
            try:
                records = json.loads(raw_records)
            except json.JSONDecodeError as exc:
                fail(f"CLOUDFLARE_RECORDS contains invalid JSON: {exc}")
            specs = []
            for record in records:
                name = str(record.get("name", "")).strip().rstrip(".")
                if not name:
                    fail("each CLOUDFLARE_RECORDS JSON entry must include a name")
                specs.append(
                    {
                        "name": name,
                        "ttl": int(record.get("ttl", default_ttl)),
                        "proxied": parse_bool(record.get("proxied", default_proxied)),
                    }
                )
            return specs

        return [
            {"name": value.strip().rstrip("."), "ttl": default_ttl, "proxied": default_proxied}
            for value in raw_records.split(",")
            if value.strip()
        ]


    def main():
        token = os.environ.get("CLOUDFLARE_API_TOKEN")
        if not token:
            fail("CLOUDFLARE_API_TOKEN is not set")

        zone_name = os.environ.get("CLOUDFLARE_ZONE", "cyphers.app").strip().rstrip(".")
        record_specs = parse_record_specs()
        public_ip = current_public_ip()

        zones = request("GET", f"/zones?name={quote(zone_name)}&status=active", token)
        if not zones:
            fail(f"Cloudflare zone not found: {zone_name}")
        zone_id = zones[0]["id"]

        print(f"Detected public IPv4: {public_ip}")
        for spec in record_specs:
            record_name = spec["name"]
            query = f"/zones/{zone_id}/dns_records?type=A&name={quote(record_name)}"
            records = request("GET", query, token)
            desired = {
                "type": "A",
                "name": record_name,
                "content": public_ip,
                "ttl": spec["ttl"],
                "proxied": spec["proxied"],
            }

            if not records:
                request("POST", f"/zones/{zone_id}/dns_records", token, desired)
                print(f"Created {record_name} -> {public_ip} proxied={spec['proxied']} ttl={spec['ttl']}")
                continue

            for record in records:
                needs_update = (
                    record.get("content") != public_ip
                    or bool(record.get("proxied")) != spec["proxied"]
                    or int(record.get("ttl", spec["ttl"])) != spec["ttl"]
                )
                if not needs_update:
                    print(f"Up-to-date: {record_name} -> {public_ip} proxied={spec['proxied']} ttl={spec['ttl']}")
                    continue
                request(
                    "PATCH",
                    f"/zones/{zone_id}/dns_records/{record['id']}",
                    token,
                    desired,
                )
                print(f"Updated {record_name}: {record.get('content')} -> {public_ip} proxied={spec['proxied']} ttl={spec['ttl']}")


    if __name__ == "__main__":
        main()
